{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "product-catalog-api.fullname" . }}-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "product-catalog-api.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  defaultBackend:
    service:
      name: {{ include "product-catalog-api.fullname" . }}-service
      port:
        number: {{ .Values.service.port }}
  rules:
  {{- if .Values.ingress.hosts }}
  {{- range .Values.ingress.hosts }}
  - host: {{ .host | quote }}
    http:
      paths:
      {{- range .paths }}
      - path: {{ .path }}
        pathType: {{ .pathType }}
        backend:
          service:
            name: {{ include "product-catalog-api.fullname" . }}-service
            port:
              number: {{ $.Values.service.port }}
      {{- end }}
  {{- end }}
  {{- else }}
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "product-catalog-api.fullname" . }}-service
            port:
              number: {{ .Values.service.port }}
  {{- end }}
{{- end }}
