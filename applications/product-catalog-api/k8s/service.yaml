apiVersion: v1
kind: Service
metadata:
  name: product-catalog-api-service
  namespace: cn-er-dev
  labels:
    app.kubernetes.io/name: product-catalog-api
    environment: dev
  annotations:
    # Explicitly enable Network Endpoint Groups (NEG) for Container-Native Load Balancing.
    # This ensures the NEG is created immediately when the Service is provisioned.
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  selector:
    app.kubernetes.io/name: product-catalog-api
