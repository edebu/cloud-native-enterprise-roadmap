apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-catalog-api
  namespace: cn-er-dev
  labels:
    app.kubernetes.io/name: product-catalog-api
    environment: dev
    phase: phase2
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: product-catalog-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: product-catalog-api
    spec:
      # Security: Do not run as root. Match the user UID/GID from PR 2.2 Dockerfile.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
      - name: api
        image: "europe-west3-docker.pkg.dev/spartan-alcove-450719-n2/app-images/product-catalog-api:v0.1.0"
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP

        # Security: Harden container runtime permissions
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL

        # Environment variables sourced from ConfigMap and Secret
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: product-catalog-api-config
              key: DB_HOST
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: product-catalog-api-config
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: product-catalog-api-config
              key: DB_USER
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: product-catalog-api-config
              key: DB_PORT
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: product-catalog-api-secret
              key: DB_PASSWORD

        # Resource limits for GKE Autopilot.
        # Autopilot automatically adjusts these to the minimum allowed if they are too small.
        # Minimal allowed on Autopilot: 250m CPU, 512Mi Memory.
        resources:
          limits:
            cpu: "250m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "512Mi"

        # Liveness & Readiness Probes checking FastAPI's /health endpoint
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 3

        # Mount emptyDir for temporary writes required by Python/OS when root FS is read-only
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp

      volumes:
      - name: tmp-volume
        emptyDir: {}
