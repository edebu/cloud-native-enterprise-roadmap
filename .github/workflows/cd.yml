# .github/workflows/cd.yml
#
# CD Pipeline — Runs on merge to main (Continuous Delivery)
#
# Triggers when application code or GitOps manifests change on main.
#
# Steps:
#   1. Authenticate to GCP via Workload Identity Federation (keyless — no SA keys)
#   2. Docker build with commit SHA tag
#   3. Push to Google Artifact Registry (GAR)
#   4. Update GKE kubeconfig
#   5. Trigger ArgoCD app sync
#
# Required GitHub Secrets (set in repo Settings > Secrets > Actions):
#   GCP_PROJECT_ID         — GCP project ID
#   GCP_WIF_PROVIDER       — Workload Identity Federation provider resource name
#   GCP_WIF_SERVICE_ACCOUNT — GSA email for WIF impersonation
#   GCP_REGION             — GCP region (europe-west3)
#   GKE_CLUSTER_NAME       — GKE cluster name (cn-er-dev-autopilot)
#
# Workload Identity Federation setup (required before first run):
#   gcloud iam workload-identity-pools create github-pool \
#     --location="global" --display-name="GitHub Actions Pool"
#   gcloud iam workload-identity-pools providers create-oidc github-provider \
#     --workload-identity-pool=github-pool \
#     --attribute-mapping="google.subject=assertion.sub,attribute.repository=assertion.repository" \
#     --issuer-uri="https://token.actions.githubusercontent.com"
#
# ADR: docs/decision-records/013-github-actions-cicd.md

name: CD — Build, Push & Deploy

on:
  push:
    branches:
      - main
    paths:
      - "applications/**"
      - "gitops/**"

env:
  REGION: europe-west3
  GAR_HOSTNAME: europe-west3-docker.pkg.dev
  IMAGE_REPO: ${{ secrets.GCP_PROJECT_ID }}/app-images/product-catalog-api
  GKE_CLUSTER: cn-er-dev-autopilot

permissions: read-all

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build & Push to GAR
  # ---------------------------------------------------------------------------
  build-push:
    name: Build & Push to Artifact Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Required for Workload Identity Federation

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      short_sha: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Keyless authentication — no service account JSON key needed
      # GCP Workload Identity Federation exchanges the GitHub OIDC token
      # for a short-lived GCP access token.
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker to use GAR
        run: gcloud auth configure-docker ${{ env.GAR_HOSTNAME }} --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GAR_HOSTNAME }}/${{ env.IMAGE_REPO }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image to GAR
        uses: docker/build-push-action@v6
        with:
          context: applications/product-catalog-api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Job 2: Trigger ArgoCD Sync
  # ---------------------------------------------------------------------------
  argocd-sync:
    name: ArgoCD Sync
    runs-on: ubuntu-latest
    needs: build-push
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.REGION }}

      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o /usr/local/bin/argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd

      - name: ArgoCD login (admin via kubectl port-forward)
        run: |
          kubectl port-forward svc/argocd-server -n argocd 8080:443 &
          sleep 5
          ARGOCD_PASSWORD=$(kubectl -n argocd get secret argocd-initial-admin-secret \
            -o jsonpath="{.data.password}" | base64 -d)
          argocd login localhost:8080 \
            --username admin \
            --password "$ARGOCD_PASSWORD" \
            --insecure

      - name: Sync ArgoCD application
        run: |
          argocd app sync product-catalog-api \
            --revision HEAD \
            --prune \
            --timeout 300

      - name: Wait for ArgoCD sync to complete
        run: |
          argocd app wait product-catalog-api \
            --health \
            --timeout 300
